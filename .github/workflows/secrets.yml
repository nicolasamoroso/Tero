name: Secrets

# Gitleaks busca secretos (tokens, claves, contraseñas) en el historial de git.
# En un PR o un push revisa los commits nuevos; a mano (workflow_dispatch) revisa todo el historial.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # La misma versión con la que se escaneó el historial
          GITLEAKS_VERSION: 8.30.1
          # Sin comentarios en el PR: el hallazgo se ve en el resumen del job y no hace falta pull-requests: write
          GITLEAKS_ENABLE_COMMENTS: false
