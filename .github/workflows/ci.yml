name: CI

on:
  pull_request:
    branches: [develop, main]
  push:

permissions:
  contents: read
  pull-requests: read

# Si llega un push nuevo a la misma rama, se cancela la corrida anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Detecta qué servicios cambiaron. Si se toca este workflow, se prueban todos.
  changes:
    name: detectar cambios
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ui:
              - 'src/ui/**'
              - '.github/workflows/ci.yml'
            admin:
              - 'src/admin/**'
              - '.github/workflows/ci.yml'
            checkout:
              - 'src/checkout/**'
              - '.github/workflows/ci.yml'
            cart:
              - 'src/cart/**'
              - '.github/workflows/ci.yml'
            catalog:
              - 'src/catalog/**'
              - '.github/workflows/ci.yml'
            orders:
              - 'src/orders/**'
              - '.github/workflows/ci.yml'

  # 2) Build y tests, solo de los servicios que cambiaron
  build:
    name: build y tests (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    env:
      TYPE: ${{ fromJSON('{"ui":"npm","admin":"npm","checkout":"yarn","cart":"python","catalog":"go","orders":"go"}')[matrix.service] }}
    defaults:
      run:
        working-directory: src/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      # ---- Node con npm (ui, admin) ----
      - uses: actions/setup-node@v5
        if: env.TYPE == 'npm'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/${{ matrix.service }}/package-lock.json
      - name: Instalar dependencias
        if: env.TYPE == 'npm'
        run: npm ci
      - name: Build
        if: env.TYPE == 'npm'
        run: npm run build
      - name: Tests
        if: env.TYPE == 'npm'
        run: npm test --if-present

      # ---- Node con Yarn 4 (checkout) ----
      - uses: actions/setup-node@v5
        if: env.TYPE == 'yarn'
        with:
          node-version: 22
      - uses: actions/cache@v5
        if: env.TYPE == 'yarn'
        with:
          path: |
            ~/.yarn/berry/cache
            src/${{ matrix.service }}/.yarn/cache
          key: yarn-${{ matrix.service }}-${{ hashFiles(format('src/{0}/yarn.lock', matrix.service)) }}
          restore-keys: yarn-${{ matrix.service }}-
      - name: Instalar dependencias
        if: env.TYPE == 'yarn'
        run: yarn install --immutable
      - name: Build
        if: env.TYPE == 'yarn'
        run: yarn build
      - name: Tests
        if: env.TYPE == 'yarn'
        run: yarn test

      # ---- Python (cart) ----
      - uses: actions/setup-python@v6
        if: env.TYPE == 'python'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/${{ matrix.service }}/requirements*.txt
      - name: Instalar dependencias
        if: env.TYPE == 'python'
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-dev.lock
      - name: Verificar que el código compila
        if: env.TYPE == 'python'
        run: python -m compileall -q app
      - name: Tests con coverage
        if: env.TYPE == 'python' && hashFiles(format('src/{0}/tests/**', matrix.service)) != ''
        run: python -m pytest --cov=app --cov-report=xml --cov-report=term

      # ---- Go (catalog, orders) ----
      - uses: actions/setup-go@v6
        if: env.TYPE == 'go'
        with:
          go-version-file: src/${{ matrix.service }}/go.mod
          cache-dependency-path: src/${{ matrix.service }}/go.sum
      - name: Build
        if: env.TYPE == 'go'
        run: go build ./...
      - name: Tests con coverage
        if: env.TYPE == 'go'
        run: |
          go test ./... -coverpkg=./... -coverprofile=coverage.out -covermode=atomic
          if [ -f coverage.out ]; then go tool cover -func=coverage.out | tail -n 1; fi

      # ---- Coverage como artefacto (si se generó) ----
      - name: Subir coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.service }}
          path: |
            src/${{ matrix.service }}/coverage.out
            src/${{ matrix.service }}/coverage.xml
            src/${{ matrix.service }}/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # 3) Un único check para toda la matrix: sirve como check obligatorio de la rama
  ci-ok:
    name: CI ok
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar el resultado de la matrix
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "Resultado del build: $RESULT"
          [[ "$RESULT" == "success" || "$RESULT" == "skipped" ]]
