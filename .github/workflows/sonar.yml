name: Sonar

# Análisis de calidad en SonarCloud con el coverage de los 4 servicios que tienen tests.
# Corre los tests de todos los servicios (no solo los que cambiaron) para que el coverage sea completo,
# y falla si no pasa el quality gate.
on:
  pull_request:
    branches: [develop, main]
  # En el plan gratis de SonarCloud solo la rama principal (main) tiene quality gate; en develop
  # el gate se aplica en los PRs, antes de mergear
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/catalog/go.mod
          cache-dependency-path: src/*/go.sum

      - name: Coverage de catalog y orders
        run: |
          for svc in catalog orders; do
            (cd "src/$svc" && go test ./... -coverpkg=./... -coverprofile=coverage.out -covermode=atomic)
          done

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/cart/requirements*.txt

      - name: Coverage de cart
        working-directory: src/cart
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-dev.lock
          python -m pytest --cov=app --cov-report=xml

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Coverage de checkout
        working-directory: src/checkout
        # Sin scripts de instalación de las dependencias: los tests no los necesitan
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: |
          yarn install --immutable
          yarn test

      - name: Análisis y quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
