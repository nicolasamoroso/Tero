name: CD

# Construye la imagen de cada servicio, la escanea con Trivy y la sube a ECR.
# - Push a develop: imagen con el SHA corto del commit (el mismo formato que scripts/subir-imagenes.sh).
# - Tag v*: además del SHA, la imagen lleva el semver del release (por ejemplo v0.2.0).
# - Push a develop: después de subir las imágenes, despliega ese SHA en dev con terraform apply.
on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  imagen:
    name: imagen (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ui, admin, checkout, cart, catalog, orders]
    steps:
      - uses: actions/checkout@v5

      - name: Calcular los tags
        id: tags
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "semver=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      # Academy no permite OIDC: se usan las credenciales del lab guardadas como secrets
      # (se renuevan con scripts/renovar-credenciales-aws.sh)
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Definir la imagen
        id: imagen
        run: echo "nombre=${{ steps.ecr.outputs.registry }}/tero/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      # Los tags de ECR son inmutables: si la imagen de este commit ya está, no se vuelve a construir
      - name: Ver si la imagen ya existe
        id: existe
        run: |
          if aws ecr describe-images --repository-name "tero/${{ matrix.service }}" \
               --image-ids imageTag="${{ steps.tags.outputs.sha }}" >/dev/null 2>&1; then
            echo "si=true" >> "$GITHUB_OUTPUT"
            echo "tero/${{ matrix.service }}:${{ steps.tags.outputs.sha }} ya está en ECR, no se construye."
          else
            echo "si=false" >> "$GITHUB_OUTPUT"
          fi

      # Sin provenance ni SBOM, para que cada tag apunte a una sola imagen
      - name: Build
        if: steps.existe.outputs.si == 'false'
        run: |
          docker build --provenance=false --sbom=false \
            -t "${{ steps.imagen.outputs.nombre }}:${{ steps.tags.outputs.sha }}" \
            "src/${{ matrix.service }}"

      # Gate: si la imagen tiene vulnerabilidades CRITICAL o HIGH con parche disponible, no se sube
      - name: Trivy image
        if: steps.existe.outputs.si == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.imagen.outputs.nombre }}:${{ steps.tags.outputs.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Push a ECR
        if: steps.existe.outputs.si == 'false'
        run: docker push "${{ steps.imagen.outputs.nombre }}:${{ steps.tags.outputs.sha }}"

      # En un release, la misma imagen recibe también el semver (sin reconstruir)
      - name: Tag del release
        if: steps.tags.outputs.semver != ''
        run: |
          MANIFEST=$(aws ecr batch-get-image --repository-name "tero/${{ matrix.service }}" \
            --image-ids imageTag="${{ steps.tags.outputs.sha }}" \
            --query 'images[0].imageManifest' --output text)
          aws ecr put-image --repository-name "tero/${{ matrix.service }}" \
            --image-tag "${{ steps.tags.outputs.semver }}" --image-manifest "$MANIFEST" >/dev/null
          echo "tero/${{ matrix.service }}:${{ steps.tags.outputs.semver }} apunta a ${{ steps.tags.outputs.sha }}"

  # Deploy a dev: con las 6 imágenes en ECR, aplica Terraform con el SHA nuevo.
  # Usa el mismo grupo de concurrencia que el apply de infra.yml, así nunca corren dos terraform a la vez en dev.
  deploy-dev:
    name: deploy (dev)
    needs: imagen
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-apply-dev
      cancel-in-progress: false
    env:
      ENVIRONMENT: dev
      CLUSTER: tero-dev
      SERVICES: ui admin checkout carts catalog orders
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # En Academy dev se destruye al terminar el día: si está apagado no se despliega,
      # porque levantarlo entero en cada merge gasta presupuesto. Se levanta con infra.yml.
      # Solo cuenta como apagado si el cluster o el servicio no existen; cualquier otro error falla.
      - name: Ver si dev está levantado
        id: dev
        run: |
          if SALIDA=$(aws ecs describe-services --cluster "$CLUSTER" --services ui \
               --query 'services[0].status' --output text 2>&1); then
            ESTADO="$SALIDA"
          elif [[ "$SALIDA" == *ClusterNotFoundException* ]]; then
            ESTADO="NO_EXISTE"
          else
            echo "::error::No se pudo consultar ECS: $SALIDA"
            exit 1
          fi
          if [[ "$ESTADO" == "ACTIVE" ]]; then
            echo "levantado=true" >> "$GITHUB_OUTPUT"
          else
            echo "levantado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dev está apagado, no se despliega. Las imágenes ${GITHUB_SHA::7} quedaron en ECR."
          fi

      - name: terraform init
        if: steps.dev.outputs.levantado == 'true'
        run: terraform init -input=false -backend-config="envs/backend-${ENVIRONMENT}.hcl"

      - name: terraform plan
        if: steps.dev.outputs.levantado == 'true'
        env:
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_admin_ingress_cidr: ${{ secrets.ADMIN_INGRESS_CIDR }}
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
        run: |
          export TF_VAR_image_tag="${TF_VAR_image_tag::7}"
          terraform plan -input=false -lock-timeout=5m -var-file="envs/${ENVIRONMENT}.tfvars" -out=tfplan

      - name: terraform apply
        if: steps.dev.outputs.levantado == 'true'
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Esperar a que los servicios queden estables
        if: steps.dev.outputs.levantado == 'true'
        run: aws ecs wait services-stable --cluster "$CLUSTER" --services $SERVICES

      # APP_VERSION de la task definition que corre tiene que ser el SHA de este commit
      - name: Verificar la versión desplegada
        if: steps.dev.outputs.levantado == 'true'
        run: |
          ESPERADO="${GITHUB_SHA::7}"
          FALLA=0
          for svc in $SERVICES; do
            TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
              --query 'services[0].taskDefinition' --output text)
            VERSION=$(aws ecs describe-task-definition --task-definition "$TD" \
              --query "taskDefinition.containerDefinitions[0].environment[?name=='APP_VERSION'].value | [0]" --output text)
            echo "$svc: APP_VERSION=$VERSION"
            [[ "$VERSION" == "$ESPERADO" ]] || FALLA=1
          done
          if [[ "$FALLA" == 1 ]]; then
            echo "::error::Algún servicio no corre la versión $ESPERADO"
            exit 1
          fi
