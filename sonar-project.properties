sonar.organization=nicolasamoroso
sonar.projectKey=nicolasamoroso_Tero
sonar.projectName=Tero

# Código de los 6 servicios. Tests, dependencias y builds quedan afuera.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*_test.go,**/tests/**,**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/coverage/**,**/.yarn/**,**/*_test.go,**/tests/**,**/*.spec.ts

# Reportes de coverage que genera el workflow (los mismos formatos que el CI de DEV-25)
sonar.go.coverage.reportPaths=src/catalog/coverage.out,src/orders/coverage.out
sonar.python.coverage.reportPaths=src/cart/coverage.xml
sonar.javascript.lcov.reportPaths=src/checkout/coverage/lcov.info
sonar.python.version=3.12

# main.go solo arma las rutas y arranca el servidor: no se prueba con tests unitarios
sonar.coverage.exclusions=**/main.go
